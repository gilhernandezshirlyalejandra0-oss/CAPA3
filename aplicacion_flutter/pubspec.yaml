publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  go_router: ^18.1.1
  flutter_tts: ^4.2.5
